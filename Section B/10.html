<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-center mt-10">

<p id="p">Old Text</p>
<button onclick="change()" class="bg-blue-500 text-white px-4 py-2">Click</button>

<script>
function change(){
 document.getElementById("p").innerText="New Text";
}
</script>

</body>
</html>
