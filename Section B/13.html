<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<p id="even"></p>

<script>
let text="";
for(let i=1;i<=20;i++){
 if(i%2==0){
  text+=i+" ";
 }
}
document.getElementById("even").innerText=text;
</script>

</body>
</html>
