<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Student Object</title>
</head>
<body class="p-10">

<p id="output"></p>

<script>
let student = {
  name: "Zabed",
  id: "123",
  department: "CSE"
};

document.getElementById("output").innerHTML =
  student.name + "<br>" + student.id + "<br>" + student.department;
</script>

</body>
</html>
