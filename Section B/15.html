<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-center mt-10">

<img id="img" src="https://www.tbsnews.net/sites/default/files/styles/big_3/public/images/2024/10/13/feature-image_13.png" class="mx-auto">

<button onclick="toggle()" class="bg-purple-500 text-white px-4 py-2 mt-4">
Toggle Image
</button>

<script>
function toggle(){
 let img=document.getElementById("img");

 if(img.style.display=="none"){
  img.style.display="block";
 } else {
  img.style.display="none";
 }
}
</script>

</body>
</html>
