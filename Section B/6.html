<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 text-center">

<input id="num" class="border p-2">
<button onclick="check()" class="bg-blue-500 text-white px-3 py-1">Check</button>

<script>
function check(){
  let n = document.getElementById("num").value;
  if(n % 2 == 0){
    alert("Even");
  } else {
    alert("Odd");
  }
}
</script>

</body>
</html>
