<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-center mt-10">

<button onclick="toggle()">Toggle Mode</button>

<script>
function toggle(){
 document.body.classList.toggle("bg-black");
 document.body.classList.toggle("text-white");
}
</script>

</body>
</html>
